<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 560" width="1130" height="560" role="img" aria-label="architecture">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#14233f"/></marker></defs>
<rect width="1130" height="560" rx="14" fill="#ffffff" stroke="#d5dded"/>
<text x="24" y="36" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#14233f">How the pieces fit</text>
<rect x="24" y="70" width="226" height="160" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/><text x="38" y="96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14233f">Ingestion</text><text x="38" y="116" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">WSS new heads, batched logs</text><text x="38" y="134" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">parent-hash reorg guard</text><text x="38" y="152" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">no-lookahead 1-min candles</text><text x="38" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">zero-gap fill, gap backfill</text>
<rect x="292" y="70" width="250" height="160" rx="10" fill="#f4f1ff" stroke="#7c5cd6" stroke-width="1.5"/><text x="306" y="96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14233f">Event bus</text><text x="306" y="116" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">typed topics, bounded queues</text><text x="306" y="134" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">overflow = stale data</text><text x="306" y="152" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">=> freeze (never drop)</text>
<rect x="584" y="70" width="250" height="160" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/><text x="598" y="96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14233f">Strategy matrix</text><text x="598" y="116" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">Hurst (R/S, bias-corrected)</text><text x="598" y="134" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">VWAP / ATR / flow imbalance</text><text x="598" y="152" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">pure functions, unit-tested</text>
<rect x="876" y="70" width="230" height="160" rx="10" fill="#eafaf1" stroke="#2f9e6b" stroke-width="1.5"/><text x="890" y="96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14233f">Execution router</text><text x="890" y="116" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">re-checks at time of use</text><text x="890" y="134" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">approve exact, swap, approve 0</text><text x="890" y="152" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">eth_simulateV1 before send</text>
<rect x="334" y="268" width="250" height="130" rx="10" fill="#fff4e8" stroke="#e08a2d" stroke-width="1.5"/><text x="348" y="294" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14233f">Security validator</text><text x="348" y="314" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">honeypot / tax by eth_call</text><text x="348" y="332" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">state-override simulator</text><text x="348" y="350" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">LP lock, owner, proxy, holders</text><text x="348" y="368" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">fail closed on any doubt</text>
<rect x="626" y="268" width="250" height="130" rx="10" fill="#fff0f0" stroke="#d64545" stroke-width="1.5"/><text x="640" y="294" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14233f">Risk</text><text x="640" y="314" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">fractional Kelly, prior = no edge</text><text x="640" y="332" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">circuit breaker, daily 3% sleep</text><text x="640" y="350" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">kill switch, max notional</text>
<rect x="24" y="268" width="280" height="130" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="38" y="294" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14233f">System state machine</text><text x="38" y="314" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">BOOTING / ARMED / FROZEN</text><text x="38" y="332" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">SLEEPING / HALTED</text><text x="38" y="350" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">isolated, timed safety handlers</text><text x="38" y="368" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">RTT gate 150 ms, WS gap 500 ms</text>
<rect x="24" y="424" width="1082" height="112" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/><text x="38" y="450" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14233f">Research lab (what the results come from)</text><text x="38" y="470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">pre-registered gates (GO-NO-GO) · replay on real Base logs with exact block timestamps · cross-DEX arbitrage tracker (closed form)</text><text x="38" y="488" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#33415c">15-min swing backtester · day-clustered bootstrap · shadow ledger (value of each filter) · funding-carry measurement · local mainnet-fork test with fake ETH</text>
<line x1="250" y1="150" x2="292" y2="150" stroke="#14233f" stroke-width="2" marker-end="url(#a)"/><line x1="542" y1="150" x2="584" y2="150" stroke="#14233f" stroke-width="2" marker-end="url(#a)"/><line x1="834" y1="150" x2="876" y2="150" stroke="#14233f" stroke-width="2" marker-end="url(#a)"/><line x1="710" y1="230" x2="710" y2="268" stroke="#14233f" stroke-width="2" marker-end="url(#a)"/><line x1="460" y1="230" x2="460" y2="268" stroke="#14233f" stroke-width="2" marker-end="url(#a)"/>
</svg>